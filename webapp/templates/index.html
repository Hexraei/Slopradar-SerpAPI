<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SlopRadar</title><link rel="stylesheet" href="/static/app.css"></head><body><main><header><a href="/">SlopRadar</a><span>Search results from SerpApi</span></header><section class="search"><h1>Check the<br>writing.</h1><form id="scan"><label for="query">Search term</label><div class="input-row"><input id="query" name="query" minlength="2" maxlength="120" required placeholder="ai writing tools" autocomplete="off"><button type="submit">Check the writing</button></div><p class="note">English pages, US Google results. Checks style, not who wrote it.</p></form><div class="scanner-art" aria-label="Six writing-example notes. Click each note to drop it."></div></section><div id="state" role="status" aria-live="polite"></div><section id="result" hidden><div class="result-tools"><span id="freshness"></span><button id="download" type="button">Save report</button></div><iframe id="report" title="Page scores and matched phrases" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></section><footer>20 new searches a day (UTC). Repeat terms use saved results for 24 hours.</footer></main><script src="/static/app.js" defer></script><script src="/static/anime.min.js" defer></script><script src="/static/notes.js" defer></script></body></html>
